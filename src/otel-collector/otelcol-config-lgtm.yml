exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → Mimir
  otlphttp/mimir:
    endpoint: http://mimir:9009/otlp

  # Logs → Loki
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:

    traces:
      exporters:
        - debug
        - otlp_grpc/jaeger
        - span_metrics
        - otlp/tempo

    metrics:
      exporters:
        - debug
        - otlp_http/prometheus
        - otlphttp/mimir

    logs:
      exporters:
        - debug
        - opensearch
        - otlphttp/loki

    profiles:
      exporters:
        - debug
        - otlp_grpc/firepit
