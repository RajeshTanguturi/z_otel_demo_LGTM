# Disable authentication
auth_enabled: false

server:
  # Loki HTTP API port.
  http_listen_port: 3100

common:
  # Base directory for Loki data.
  path_prefix: /loki

  # Single-node setup.
  replication_factor: 1

  # Store ring information in memory.
  ring:
    kvstore:
      store: inmemory

storage_config:
  # Store log chunks on the local filesystem.
  filesystem:
    directory: /loki/chunks

schema_config:
  configs:
    - from: 2024-01-01
      # Use TSDB as the index store.
      store: tsdb

      # Store data on the local filesystem.
      object_store: filesystem

      # Loki storage schema version.
      schema: v13

      index:
        # Prefix for index files.
        prefix: index_

        # Create a new index every 24 hours.
        period: 24h

compactor:
  # Directory used by the compactor.
  working_directory: /loki/compactor

  # Retention is disabled.
  # Retention = how long Loki keeps stored logs before deleting them.
  retention_enabled: false
